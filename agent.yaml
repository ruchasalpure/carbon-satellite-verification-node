spec_version: "0.1.0"
name: carbon-satellite-verification-node
version: 1.0.0
description: Processes Sentinel-2 and Landsat multispectral satellite imagery to compute time-series NDVI and canopy height models for verifying forest carbon offset credits.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - multispectral-biomass-estimation
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - research
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/carbon-satellite-verification-node"
